<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="365" viewBox="0 0 1220 365" role="img"><title>MGAR V3.1 technical architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52718d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18344d} .title{font-size:27px;font-weight:700} .label{font-size:22px;font-weight:700} .body{font-size:18px} .small{font-size:16px;fill:#506b80}</style><rect width="100%" height="100%" fill="#f6f9fc"/><text x="600" y="40" class="title" text-anchor="middle">受限补丁、独立测试、准确审批与持久交付</text><rect x="20" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="100.0" y="115" class="label" text-anchor="middle">固定源码</text><text x="100.0" y="147" class="body" text-anchor="middle">commit / tree / blob</text><text x="100.0" y="174" class="body" text-anchor="middle">一个获准Go函数</text><path d="M180 142 L220 142" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="300.0" y="115" class="label" text-anchor="middle">受限生成</text><text x="300.0" y="147" class="body" text-anchor="middle">function_body</text><text x="300.0" y="174" class="body" text-anchor="middle">可信框架生成diff</text><path d="M380 142 L420 142" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="420" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="500.0" y="115" class="label" text-anchor="middle">验证与沙箱</text><text x="500.0" y="147" class="body" text-anchor="middle">AST / 公开测试</text><text x="500.0" y="174" class="body" text-anchor="middle">独立隐藏用例</text><path d="M580 142 L620 142" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="620" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="700.0" y="115" class="label" text-anchor="middle">完整提案审批</text><text x="700.0" y="147" class="body" text-anchor="middle">payload / diff / tree</text><text x="700.0" y="174" class="body" text-anchor="middle">测试hash / 有效期</text><path d="M780 142 L820 142" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="820" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="900.0" y="115" class="label" text-anchor="middle">Action / Outbox</text><text x="900.0" y="147" class="body" text-anchor="middle">登记发布子步骤</text><text x="900.0" y="174" class="body" text-anchor="middle">epoch / 目标写权</text><path d="M980 142 L1020 142" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1020" y="80" width="160" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="1100.0" y="115" class="label" text-anchor="middle">GitHub Draft PR</text><text x="1100.0" y="147" class="body" text-anchor="middle">分支 / 提交 / PR</text><text x="1100.0" y="174" class="body" text-anchor="middle">只读核对完整对象</text><path d="M1100 205 L1100 245" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="245" width="460" height="85" rx="14" fill="#fff2e6" stroke="#b9ccdc" stroke-width="2"/><text x="950.0" y="280" class="label" text-anchor="middle">结果未知：保留现场，停止新写</text><text x="950.0" y="312" class="body" text-anchor="middle">只读对账；不重发；不把Draft PR等同上线</text><text x="350" y="278" class="small" text-anchor="middle">编辑补丁 → 旧提案失效 → 重新测试和审批</text><text x="350" y="310" class="small" text-anchor="middle">模型、编译和网络调用都在业务事务之外</text></svg>