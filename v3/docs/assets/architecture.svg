<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>MGAR V3.1 technical architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52718d"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18344d} .title{font-size:27px;font-weight:700} .label{font-size:22px;font-weight:700} .body{font-size:18px} .small{font-size:16px;fill:#506b80}</style><rect width="100%" height="100%" fill="#f6f9fc"/><text x="600" y="42" class="title" text-anchor="middle">PG权威业务状态 · 有界模型与工具 · 可恢复交付</text><rect x="300" y="70" width="600" height="80" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="600.0" y="105" class="label" text-anchor="middle">Web / CLI / GitHub 事件</text><text x="600.0" y="137" class="body" text-anchor="middle">持久接入、事件去重、原本地认证</text><path d="M600 150 L600 185" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="185" width="600" height="125" rx="14" fill="#e4f0fb" stroke="#b9ccdc" stroke-width="2"/><text x="600.0" y="220" class="label" text-anchor="middle">Engine：全局业务唯一写者</text><text x="600.0" y="252" class="body" text-anchor="middle">持久PG会话 + advisory lock</text><text x="600.0" y="279" class="body" text-anchor="middle">授权、版本、epoch、预算及目标写权重核</text><path d="M435 310 L320 355" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M765 310 L880 355" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="355" width="520" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="320.0" y="390" class="label" text-anchor="middle">LangGraph / Run / 专家</text><text x="320.0" y="422" class="body" text-anchor="middle">Mailbox安全点输入、有限重规划</text><text x="320.0" y="449" class="body" text-anchor="middle">图状态不替代全局业务事实</text><rect x="620" y="355" width="520" height="125" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="880.0" y="390" class="label" text-anchor="middle">PostgreSQL业务账本</text><text x="880.0" y="422" class="body" text-anchor="middle">Thread / Mandate / Ticket / Run</text><text x="880.0" y="449" class="body" text-anchor="middle">Evidence / Usage / Action / Outbox</text><path d="M180 480 L180 530" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M445 480 L545 530" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M925 480 L965 530" fill="none" stroke="#52718d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="530" width="290" height="105" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="180.0" y="565" class="label" text-anchor="middle">独立状态与缓存</text><text x="180.0" y="597" class="body" text-anchor="middle">PG Checkpoints</text><text x="180.0" y="624" class="body" text-anchor="middle">Redis可重建缓存</text><rect x="365" y="530" width="360" height="105" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="545.0" y="565" class="label" text-anchor="middle">工具、证据与模型</text><text x="545.0" y="597" class="body" text-anchor="middle">知识 / 只读SQL / 固定代码</text><text x="545.0" y="624" class="body" text-anchor="middle">DeepSeek / CAS / Go沙箱</text><rect x="765" y="530" width="400" height="105" rx="14" fill="#ffffff" stroke="#b9ccdc" stroke-width="2"/><text x="965.0" y="565" class="label" text-anchor="middle">审批与发布</text><text x="965.0" y="597" class="body" text-anchor="middle">准确payload_hash → Dispatcher</text><text x="965.0" y="624" class="body" text-anchor="middle">GitHub回执 / 未知只读对账</text><text x="600" y="682" class="small" text-anchor="middle">外部I/O与文件操作在业务事务外；陈旧输入/epoch与越权提交由Engine拒绝。</text></svg>